name: ci

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyyaml (for YAML validity check)
        run: python -m pip install --quiet pyyaml

      - name: Static checks (syntax / JSON / YAML / privacy scan)
        run: python tools/check.py
